<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
        }

        .btn-space {
            display: inline-block;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ff6b35;
            background: #ffffff;
            border: 3px solid #ff6b35;
            border-radius: 50px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
            cursor: pointer;
        }

        .btn-space:hover {
            color: #ffffff;
            background: #ff6b35;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.5);
        }

        .btn-space:active {
            transform: translateY(0);
        }

        /* Efek glow di belakang */
        .glow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,107,53,0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <a href="APEXRACER.html" class="btn-space">🚀 Ke APEX</a>
        <a href="space.html" class="btn-space">🚀 Ke Space</a>
        <a href="Bid.html" class="btn-space">🚀 Ke Bid</a>
    </div>
</body>
</html>
